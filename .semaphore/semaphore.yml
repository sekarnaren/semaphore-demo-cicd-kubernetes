version: v1.0
name: Docker
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Build
    task:
      jobs:
        - name: docker build
          commands:
            - checkout
            - echo $DOCKER_PASSWORD | docker login --username $DOCKER_USERNAME --password-stdin
            - 'docker pull $DOCKER_USERNAME/demo:latest || true'
            - 'docker build --cache-from $DOCKER_USERNAME/demo:latest -t $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID .'
            - 'docker push $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID'
      secrets:
        - name: dockerhub
